services:

  nginx:
    image: nginx:stable-trixie-perl
    container_name: bt-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/hello.html:/usr/share/nginx/html/hello.html:ro
    networks:
      - bt-network

  user-service:
    build:
      context: ../../bt-user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "9696:9696"
    env_file:
      - .env
    environment:
      USER_DB_URL: ${USER_DB_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - bt-network

  restaurant-service:
    build:
      context: ../../bt-restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "9797:9797"
    env_file:
      - .env
    environment:
      RESTAURANT_DB_URL: ${RESTAURANT_DB_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - bt-network

  review-service:
    build:
      context: ../../bt-review-service
      dockerfile: Dockerfile
    container_name: review-service
    ports:
      - "9898:9898"
    env_file:
      - .env
    environment:
      REVIEW_DB_URL: ${REVIEW_DB_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - bt-network

  booking-service:
    build:
      context: ../../bt-booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "9999:9999"
    env_file:
      - .env
    environment:
      BOOKING_DB_URL: ${BOOKING_DB_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - bt-network

  notification-service:
    build:
      context: ../../bt-notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "9009:9009"
    env_file:
      - .env
    environment:
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - bt-network

  db:
    image: postgres:15
    container_name: booking-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: booking-service
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bt-network

  keycloak-db:
    image: postgres:15
    container_name: keycloak-postgres-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - bt-network

  keycloak:
    image: keycloak/keycloak:26.5
    container_name: bt-keycloak
    command: start-dev
    depends_on:
      - keycloak-db
    ports:
      - "8085:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_URL: http://nginx
    networks:
      - bt-network

  kafka:
    image: apache/kafka:4.2.0
    container_name: bt-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - bt-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: bt-kafka-ui
    ports:
      - "8086:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - bt-network

volumes:
  db-data:
  keycloak-db-data:

networks:
  bt-network:
    driver: bridge