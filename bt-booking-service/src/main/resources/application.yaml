server:
  port: 9999

spring:
  config:
    import: "optional:classpath:.env"

  kafka:
    #    bootstrap-servers: kafka:29092
    bootstrap-servers: localhost:9092
    producer:

      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      #      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:

        spring.json.add.type.headers: false
      #        spring.json.type.mapping: userCreatedEvent:goltsman.btuserservice.model.event.UserCreatedEvent
    topics:
      booking-confirmed: booking-confirmed

  datasource:
    #    url: jdbc:postgresql://db:5432/booking-service
    url: jdbc:postgresql://localhost:5432/booking-service
    username: postgres
    password: postgres

  jpa:
    hibernate:
      default_schema: public
      ddl-auto: validate
    #    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          #          issuer-uri: http://nginx/realms/booking-app
          issuer-uri: http://localhost:8085/realms/booking-app
  liquibase:
    default_schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

springdoc:

  api-docs:
    path: /api-docs/booking
  swagger-ui:
    path: /swagger/booking
    oauth:
      client-id: frontend
      client-secret: hHkmOltodovvM0UJvccbcyk57TxVpHrr

