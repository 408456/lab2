server:
  port: 9898

spring:
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: userCreatedEvent:goltsman.btuserservice.model.event.UserCreatedEvent

  config:
    import: "optional:classpath:.env"
  datasource:
    url: jdbc:postgresql://db:5432/review-service
    username: postgres
    password: postgres
  jpa:
    hibernate:
      default_schema: public
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://nginx/realms/booking-app
  liquibase:
    default_schema: public
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

springdoc:
  api-docs:
    path: /api-docs/review
  swagger-ui:
    path: /swagger/review
    oauth:
      client-id: frontend
      client-secret: yEvAIJerp4leWg5t3EdgkM4ExZjbNYXw

keycloak:
  realm: booking-app
  serverUrl: http://localhost:8085

clients:
  restaurant-service:
    base-url: http://restaurant-service:9797/